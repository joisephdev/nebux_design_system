name: Publish to pub.dev

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get

      - name: Validate package (dry-run)
        run: dart pub publish --dry-run

      - name: Reset auto-generated analysis_options.yaml changes
        # flutter/dart tooling may auto-migrate analysis_options.yaml
        # (e.g. adding build/platform excludes) as a side effect of the
        # analysis pass above. Discard that so pub's git-clean check passes.
        run: git checkout -- analysis_options.yaml

      - name: Publish to pub.dev
        run: flutter pub publish --force
