name: Publish to pub.dev

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get

      # Flutter 3.47+ may rewrite analysis_options.yaml during `flutter pub get`
      # if analyzer.exclude is missing the exact build/platform patterns.
      # Restore a clean tree before validation; flutter pub publish also runs
      # the migrator, so analysis_options.yaml must already be a no-op.
      - name: Restore analysis_options.yaml if tooling rewrote it
        run: git checkout -- analysis_options.yaml

      - name: Validate package (dry-run)
        run: dart pub publish --dry-run

      - name: Publish to pub.dev
        run: flutter pub publish --force
