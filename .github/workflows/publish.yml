name: Publish to pub.dev

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get

      # Flutter 3.47+ AnalysisOptionsMigration rewrites analysis_options.yaml
      # during any `flutter` command (it injects android/ios/web/… excludes
      # this package does not need). Restore a clean tree, then publish with
      # `dart pub` so the migrator does not run again inside the publish step.
      - name: Restore analysis_options.yaml if tooling rewrote it
        run: git checkout -- analysis_options.yaml

      - name: Validate package (dry-run)
        run: dart pub publish --dry-run

      - name: Publish to pub.dev
        run: dart pub publish --force
